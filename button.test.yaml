name: ESP32 Lab OLED and button visual test
version: 1
author: ChatGPT

steps:
  - wait-serial: 'LAB_READY'
  - delay: 50ms
  - take-screenshot:
      part-id: oled1
      save-to: 'oled-boot.png'

  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: 'BUTTON:PRESSED'
  - delay: 50ms
  - take-screenshot:
      part-id: oled1
      save-to: 'oled-pressed.png'

  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: 'BUTTON:RELEASED'
  - delay: 50ms
  - take-screenshot:
      part-id: oled1
      save-to: 'oled-released.png'
