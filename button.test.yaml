name: ESP32 Lab OLED and button test
version: 1
author: ChatGPT

steps:
  - wait-serial: 'LAB_READY'

  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: 'BUTTON:PRESSED'

  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: 'BUTTON:RELEASED'
