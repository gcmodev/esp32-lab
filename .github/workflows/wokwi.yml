name: ESP32 Wokwi Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "screenshots/**"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ESP32 firmware
        run: pio run

      - name: Run Wokwi LoRa UI integration test
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: /
          timeout: 15000
          scenario: lora-ui.test.yaml
          expect_text: "RX:PING FROM H2"
          fail_text: "OLED_INIT_FAILED"
          serial_log_file: "wokwi-serial.log"

      - name: Collect screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p screenshots
          rm -f screenshots/oled-*.png
          for file in oled-*.png; do
            [ -e "$file" ] || continue
            mv "$file" screenshots/
          done

      - name: Upload Wokwi visual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-visual-results
          path: |
            screenshots/*.png
            wokwi-serial.log
          if-no-files-found: warn

      - name: Publish latest screenshots to repository
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
          else
            git commit -m "Update Wokwi visual snapshots [skip ci]"
            git push
          fi
